<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KuCoin Event Decoder</title>
  <style>
    textarea {
      width: 100%;
      box-sizing: border-box;
    }

    pre {
      background-color: #efefef;
    }
  </style>
</head>

<body>
  <textarea id="textarea" rows="20"></textarea>
  <pre id="decoded"></pre>
  <script>
    textarea.onchange = () => {
      const decodedData = decodeTrackData(textarea.value);
      decoded.innerText = JSON.stringify(decodedData, null, 4);
    }

    function decodeTrackData(str) {
      const startIdx = 'data='.length;
      const endIdx = str.lastIndexOf('&ext=');
      if (endIdx < 0 || str.length <= startIdx) return null;
      str = str.substring(startIdx, endIdx);
      str = atob(decodeURIComponent(str));
      str = Array.prototype.map.call(str, function (c) {
        const code = c.charCodeAt(0);
        // encodeURIComponent不会编码的ASCII: 33, 39~42, 45-46,48~57, 65~90, 95, 97~122, 126
        if (
          [33, 45, 46, 95, 126].includes(code)
          || code >= 39 && code <= 42
          || code >= 48 && code <= 57
          || code >= 65 && code <= 90
          || code >= 97 && code <= 122
        ) {
          return c;
        }
        return '%' + ('00' + code.toString(16)).slice(-2);
      }).join('');
      str = decodeURIComponent(str);
      return JSON.parse(str);
    }
  </script>
</body>

</html>
